<title>Closet Capture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column. Sticky category chips on top, one big shutter button, thumbnail grid for the active category below. */
:root {
  --bg: #f6f5f3;
  --surface: #ffffff;
  --fg: #1d1b1a;
  --muted: #6d6863;
  --line: #e3dfda;
  --accent: #2f4f4f;
  --accent-fg: #ffffff;
  --danger: #b3261e;
  --ok: #2e7d4f;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151413; --surface: #1f1d1c; --fg: #f1eeea; --muted: #a09a93; --line: #34312f;
    --accent: #8fc0b8; --accent-fg: #10201e; --danger: #f2877f; --ok: #6fcf97; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151413; --surface: #1f1d1c; --fg: #f1eeea; --muted: #a09a93; --line: #34312f;
  --accent: #8fc0b8; --accent-fg: #10201e; --danger: #f2877f; --ok: #6fcf97; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; margin: 0;
  padding-block: 16px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.total { color: var(--muted); font-variant-numeric: tabular-nums; }
.total b { color: var(--fg); font-family: var(--font-display); font-size: 22px; }
.seasons, .cats { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px;
  display: inline-flex; gap: 8px; align-items: center; font-weight: 500;
}
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.shutter {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--accent); color: var(--accent-fg); border-radius: 14px; padding: 22px 16px;
  font-family: var(--font-display); font-weight: 700; font-size: 20px; cursor: pointer; text-align: center;
}
.shutter small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 13px; opacity: .85; }
.alt { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.alt label { text-decoration: underline; cursor: pointer; color: var(--fg); }
.pick { position: relative; overflow: hidden; }
.pick input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.shutter.second { background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 16px; font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile {
  position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--surface);
  border: 1px solid var(--line); padding: 0;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .state {
  position: absolute; inset: auto 0 0 0; padding: 4px 6px; font-size: 12px; background: rgba(0,0,0,.6); color: #fff;
}
.tile.err .state { background: var(--danger); }
.tile .x {
  position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0;
  background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1;
}
.tile .confirm { position: absolute; inset: 0; background: rgba(0,0,0,.75); display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; }
.tile .confirm button { background: #fff; color: #111; border: 0; border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.tile .confirm button.del { background: var(--danger); color: #fff; }
.empty, .note { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; }
.note.bad { color: var(--danger); border-color: var(--danger); }
.cat-title { font-family: var(--font-display); font-size: 18px; margin: 0; }
.tip { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 4px; gap: 4px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.outfit { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.slot img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
.slot .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; gap: 6px; }
.slot .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.slot .swap { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 13px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1 1 200px; }
.btn[disabled] { opacity: .5; cursor: default; }
.status { font-weight: 600; }
.status.ok { color: var(--ok); }
.note-style { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; line-height: 1.5; }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.hrow .d { width: 84px; flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hrow .th { display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
.hrow .th img { width: 44px; height: 58px; object-fit: cover; border-radius: 6px; flex: none; }
</style>

<main>
  <div class="top">
    <h1>My Closet</h1>
    <div class="total"><b id="total">0</b> items photographed</div>
  </div>

  <div class="seasons" id="seasons" role="group" aria-label="Season"></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today's outfit</button>
    <button role="tab" data-tab="capture" aria-selected="false">Add photos</button>
  </div>

  <section id="viewToday" class="stack">
    <div id="todayHead"></div>
    <div class="outfit" id="outfit"></div>
    <div class="actions">
      <button class="btn" id="reroll">New outfit</button>
      <button class="btn primary" id="wear">I'm wearing this today</button>
    </div>
    <div class="actions"><button class="btn" id="styleBtn">Ask Claude to style it</button></div>
    <div id="styleNote"></div>
    <h2 class="cat-title">Last two weeks</h2>
    <div class="hist" id="history"></div>
  </section>

  <div id="viewCapture" class="stack" hidden>
  <div class="cats" id="cats" role="group" aria-label="Category"></div>

  <div class="shutter pick">
    <span id="shutterText">Take photo<small>Opens your camera. One item per photo.</small></span>
    <input id="cam" type="file" accept="image/*" capture="environment" aria-label="Take photo">
  </div>
  <div class="shutter second pick">
    <span>Choose from camera or photo library<small style="opacity:.7">Use this if the button above does nothing. You can pick many at once.</small></span>
    <input id="lib" type="file" accept="image/*" multiple aria-label="Choose photos">
  </div>

  <div>
    <h2 class="cat-title" id="catTitle"></h2>
    <p class="tip" id="catTip"></p>
  </div>
  <div class="grid" id="grid"></div>
  </div>
  <div id="msg"></div>
</main>

<script>
const SEASONS = [
  { id: "fall-winter", label: "Fall / Winter" },
  { id: "spring-summer", label: "Spring / Summer" },
];
const CATS = [
  { id: "tops", label: "Tops", tip: "Shirts, sweaters, hoodies, tees." },
  { id: "bottoms", label: "Bottoms", tip: "Pants, jeans, shorts, skirts." },
  { id: "outerwear", label: "Outerwear", tip: "Coats, jackets, vests." },
  { id: "shoes", label: "Shoes", tip: "Each pair once." },
  { id: "accessories", label: "Accessories", tip: "Hats, scarves, gloves, belts, bags." },
  { id: "onepiece", label: "Dresses & sets", tip: "Dresses, jumpsuits, matching sets." },
];
let season = "fall-winter", cat = "tops";
let items = [];          // saved docs {id, season, category, assetId, url}
let pending = [];        // {key, season, category, preview, status, error}
let db = null, assets = null, ready = false, confirmId = null;
const $ = (id) => document.getElementById(id);

function render() {
  $("seasons").innerHTML = SEASONS.map(s =>
    `<button class="chip" data-season="${s.id}" aria-pressed="${s.id === season}">${s.label}</button>`).join("");
  const inSeason = items.filter(i => i.season === season);
  $("total").textContent = inSeason.length;
  $("cats").innerHTML = CATS.map(c => {
    const n = inSeason.filter(i => i.category === c.id).length + pending.filter(p => p.season === season && p.category === c.id && p.status !== "error").length;
    return `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id === cat}">${c.label}<span class="n">${n}</span></button>`;
  }).join("");
  const c = CATS.find(x => x.id === cat);
  $("catTitle").textContent = c.label;
  $("catTip").textContent = c.tip;
  $("shutterText").firstChild.textContent = "Take photo of a " + c.label.toLowerCase().replace(/s$/, "").replace("dresses & set", "dress or set");

  const mine = items.filter(i => i.season === season && i.category === cat)
    .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const pend = pending.filter(p => p.season === season && p.category === cat);
  let html = pend.map(p => `<div class="tile ${p.status === "error" ? "err" : ""}"><img src="${p.preview}" alt=""><div class="state">${p.status === "error" ? "Failed: " + esc(p.error) : "Saving..."}</div></div>`).join("");
  html += mine.map(i => `<div class="tile"><img src="${i.url}" alt="${esc(c.label)} photo" loading="lazy">
    ${confirmId === i.id
      ? `<div class="confirm"><button class="del" data-del="${i.id}">Delete</button><button data-cancel>Keep</button></div>`
      : `<button class="x" data-ask="${i.id}" aria-label="Delete photo">×</button>`}</div>`).join("");
  $("grid").innerHTML = html || `<div class="empty" style="grid-column:1/-1">Nothing here yet. Tap the big button to add your first ${esc(c.label.toLowerCase())} photo.</div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.season) { season = t.dataset.season; confirmId = null; render(); syncToday(); }
  else if (t.dataset.cat) { cat = t.dataset.cat; confirmId = null; render(); }
  else if (t.dataset.ask) { confirmId = t.dataset.ask; render(); }
  else if ("cancel" in t.dataset) { confirmId = null; render(); }
  else if (t.dataset.del) { remove(t.dataset.del); }
});

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
    return blob || file;
  } catch { return file; }
}

async function handleFiles(files) {
  if (!ready) { setMsg("Storage isn't connected. Reopen this page while signed in to claude.ai.", true); return; }
  for (const file of files) {
    const p = { key: Math.random().toString(36).slice(2), season, category: cat, preview: URL.createObjectURL(file), status: "saving" };
    pending.push(p); render();
    try {
      const blob = await shrink(file);
      const up = await assets.upload(blob.type ? blob : new Blob([blob], { type: "image/jpeg" }));
      await db.collection("closet").add({ season: p.season, category: p.category, assetId: up.id, url: up.url, createdAt: new Date().toISOString() });
      pending = pending.filter(x => x !== p);
    } catch (err) {
      p.status = "error"; p.error = (err && err.message) || "try again";
    }
    render();
  }
}
for (const id of ["cam", "lib"]) {
  $(id).addEventListener("change", (e) => { const f = [...e.target.files]; e.target.value = ""; if (f.length) handleFiles(f); });
}

async function remove(id) {
  const it = items.find(i => i.id === id); confirmId = null;
  try { await db.collection("closet").doc(id).delete(); } catch (e) { setMsg("Couldn't delete that photo.", true); }
  render();
}
function setMsg(text, bad) { $("msg").innerHTML = text ? `<div class="note ${bad ? "bad" : ""}">${esc(text)}</div>` : ""; }

/* ---------- Today's outfit ---------- */
let worn = [], sample = null, outfit = [], outfitSeason = null, styling = false, tab = "today";
const LABEL = { tops: "Top", bottoms: "Bottom", outerwear: "Outerwear", shoes: "Shoes", accessories: "Accessory", onepiece: "Dress / set" };
const todayStr = () => new Date().toLocaleDateString("en-CA");
const byId = (id) => items.find(i => i.id === id);
const pool = (c) => items.filter(i => i.season === season && i.category === c);
const rnd = (a) => a[Math.floor(Math.random() * a.length)];
function recentIds() {
  const cut = new Date(Date.now() - 6 * 864e5).toLocaleDateString("en-CA"), t = todayStr(), s = new Set();
  worn.filter(w => w.date >= cut && w.date !== t).forEach(w => (w.itemIds || []).forEach(id => s.add(id)));
  return s;
}
function pick(c, exclude) {
  let p = pool(c); if (!p.length) return null;
  if (exclude && p.length > 1) p = p.filter(i => i.id !== exclude);
  const recent = recentIds(), fresh = p.filter(i => !recent.has(i.id));
  return rnd(fresh.length ? fresh : p).id;
}
function generate() {
  const slots = [], cold = season === "fall-winter";
  const useOne = pool("onepiece").length && (Math.random() < 0.25 || !pool("tops").length || !pool("bottoms").length);
  if (useOne) slots.push({ cat: "onepiece", id: pick("onepiece") });
  else for (const c of ["tops", "bottoms"]) { const id = pick(c); if (id) slots.push({ cat: c, id }); }
  if (pool("outerwear").length && (cold || Math.random() < 0.3)) slots.push({ cat: "outerwear", id: pick("outerwear") });
  if (pool("shoes").length) slots.push({ cat: "shoes", id: pick("shoes") });
  if (pool("accessories").length && Math.random() < 0.5) slots.push({ cat: "accessories", id: pick("accessories") });
  outfit = slots; outfitSeason = season; $("styleNote").innerHTML = "";
}
function syncToday() {
  const w = worn.find(x => x.id === todayStr());
  if ((!outfit.length || outfitSeason !== season) && items.length) {
    if (w && w.season === season && (w.itemIds || []).every(byId) && w.itemIds.length) {
      outfit = w.itemIds.map(id => ({ cat: byId(id).category, id })); outfitSeason = season;
    } else generate();
  }
  outfit = outfit.filter(s => byId(s.id));
  renderToday();
}
function renderToday() {
  const w = worn.find(x => x.id === todayStr());
  const n = items.filter(i => i.season === season).length;
  $("todayHead").innerHTML = w
    ? `<div class="status ok">Logged for today. You can still change it.</div>`
    : `<div class="status">${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</div>`;
  $("outfit").innerHTML = outfit.length ? outfit.map((s, i) => { const it = byId(s.id); return `<div class="slot"><img src="${it.url}" alt="${LABEL[s.cat]}"><div class="row"><span class="lbl">${LABEL[s.cat]}</span><button class="swap" data-swap="${i}">Swap</button></div></div>`; }).join("")
    : `<div class="empty" style="grid-column:1/-1">${n ? "Building your outfit..." : "No photos in this season yet. Open Add photos and take a few tops, bottoms and shoes."}</div>`;
  $("wear").textContent = w ? "Update today's outfit" : "I'm wearing this today";
  $("wear").disabled = !outfit.length; $("reroll").disabled = !n;
  $("styleBtn").hidden = !sample; $("styleBtn").disabled = !outfit.length || styling;
  const done = worn.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14);
  $("history").innerHTML = done.length ? done.map(h => `<div class="hrow"><div class="d">${new Date(h.date + "T12:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div><div class="th">${(h.itemIds || []).map(id => byId(id)).filter(Boolean).map(i => `<img src="${i.url}" alt="">`).join("")}</div></div>`).join("")
    : `<div class="empty">Nothing logged yet. Tap "I'm wearing this today" and it shows up here.</div>`;
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) {
    tab = t.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
    $("viewToday").hidden = tab !== "today"; $("viewCapture").hidden = tab !== "capture";
  } else if (t.dataset.swap !== undefined) {
    const s = outfit[+t.dataset.swap]; s.id = pick(s.cat, s.id); $("styleNote").innerHTML = ""; renderToday();
  } else if (t.id === "reroll") { generate(); renderToday(); }
  else if (t.id === "wear") {
    t.disabled = true;
    try { await db.collection("worn").doc(todayStr()).set({ date: todayStr(), season, itemIds: outfit.map(s => s.id), createdAt: new Date().toISOString() }); }
    catch { setMsg("Couldn't save today's outfit.", true); }
    renderToday();
  } else if (t.id === "styleBtn") { styleIt(); }
});
async function thumb(it) {
  const img = new Image(); img.src = "/_blob/" + it.assetId; await img.decode();
  const sc = Math.min(1, 384 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
  cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, "image/jpeg", 0.8));
}
async function styleIt() {
  styling = true; renderToday(); $("styleNote").innerHTML = `<div class="note-style">Looking at your outfit...</div>`;
  try {
    const its = outfit.map(s => ({ s, it: byId(s.id) }));
    const imgs = await Promise.all(its.map(x => thumb(x.it)));
    const list = its.map((x, i) => `Photo ${i + 1}: ${LABEL[x.s.cat]}`).join("; ");
    const r = await sample(`These photos are one outfit for a ${season === "fall-winter" ? "fall/winter" : "spring/summer"} day. ${list}. In 3 short sentences, say what colours and pieces work together, and give one specific styling tip (tuck, roll, layer, accessory). If something clashes, say which piece to swap. Plain text, no markdown.`, { images: imgs });
    $("styleNote").innerHTML = `<div class="note-style">${esc(r.text)}</div>`;
  } catch (err) {
    $("styleNote").innerHTML = `<div class="note-style">Couldn't get a styling note right now.</div>`;
  }
  styling = false; renderToday();
}

render();
(async () => {
  try {
    db = await claude.use("db"); assets = await claude.use("assets");
  } catch { db = null; }
  if (!db || !assets) { setMsg("Photo storage isn't available in this view. Open the page from your own claude.ai account to save photos.", true); return; }
  ready = true;
  db.collection("worn").onSnapshot((snap) => {
    worn = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    syncToday();
  }, () => {});
  try { sample = await claude.use("sample"); } catch { sample = null; }
  renderToday();
  const timer = setTimeout(() => setMsg("Still loading your saved photos. Taking new ones works already.", false), 10000);
  db.collection("closet").onSnapshot((snap) => {
    clearTimeout(timer); setMsg("");
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    syncToday();
  }, () => { clearTimeout(timer); setMsg("Couldn't load saved photos.", true); });
})();
</script>
